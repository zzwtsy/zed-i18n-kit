[project]
name = "zed-i18n-kit"
version = "0.1.0"
description = "Analyze and migrate Zed/GPUI UI text without maintaining a long-lived fork"
readme = "README.md"
authors = [
    { name = "zzwtsy", email = "zzwtsy@yumdeb.top" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
zed-i18n-kit = "zed_i18n_kit:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]

[tool.ruff]
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "ANN", # 强制函数类型注解
    "B",   # flake8-bugbear
    "E4",
    "E7",
    "E9",
    "F",   # Pyflakes
    "I",   # import 排序
    "PYI", # 类型存根与注解质量
    "RUF", # Ruff 专属规则
    "UP",  # 自动采用现代 Python 语法
]
preview = true

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
